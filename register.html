<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FitTrack</title>
    <link rel="stylesheet" href="output_1.css">
</head>

<body>

    <header>
        <nav>
        <a href="landing.html" class="logo">FitTrack</a>

            <div class="links">
                <a href="landing.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="exercise_library.html">Exercises</a>
                <a href="routine_builder.html">My Routine</a>
                <a href="workout_history.html">History</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">

        <div class="auth-card">

            <p class="subtitle">START YOUR JOURNEY</p>

            <h1>Create Account</h1>

            <p class="auth-description">
                Join FitTrack and start tracking your progress.
            </p>

            <form action="login.html" method="get">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <label class="terms">
                    <input type="checkbox" required>
                    I agree to the Terms and Conditions
                </label>

                <button type="submit" class="btn auth-btn">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

</body>
</html>
