<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FitTrack</title>
    <link rel="stylesheet" href="output_1.css">
</head>

<body>

    <header>
        <nav>
        <a href="landing.html" class="logo">FitTrack</a>

            <div class="links">
                <a href="landing.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="exercise_library.html">Exercises</a>
                <a href="routine_builder.html">My Routine</a>
                <a href="workout_history.html">History</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">

        <div class="auth-card">

            <p class="subtitle">WELCOME BACK</p>

            <h1>Login</h1>

            <p class="auth-description">
                Sign in to continue your fitness journey.
            </p>

            <form action="dashboard.html" method="get">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="btn auth-btn">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </main>

</body>
</html>
